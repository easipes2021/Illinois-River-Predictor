# Manual Sync Trigger: 2026-04-02-v1

name: Illinois River Auto-Update

on:
  push:
    branches:
      - main
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  update-river-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pipeline
        run: |
          echo "Starting pipeline..."
          python fetch_all_gauges.py
          echo "fetch_all_gauges.py completed"
          python fetch_nwa_precip.py
          echo "fetch_nwa_precip.py completed"
          python fetch_weather.py
          echo "fetch_weather.py completed"
          python merge_data.py
          echo "merge_data.py completed"
          ls -la *.csv
          
          # Only retrain models once a day at 06:00 UTC (12:00 AM Central Time) or on manual triggers
          CURRENT_HOUR=$(date -u +%H)
          CURRENT_MIN=$(date -u +%M)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || ([ "$CURRENT_HOUR" = "06" ] && [ "$CURRENT_MIN" -lt 30 ]); then
            echo "🔄 Running daily model retraining..."
            python predict_all.py
            git add *.pkl
          else
            echo "⏳ Skipping model retraining (scheduled daily at 06:00 UTC)"
          fi

          python forecast_now.py
          echo "forecast_now.py completed"
          echo "Running Beta Watershed Tracker..."
          python fetch_huc12_precip.py || echo "⚠️ Beta precip fetch failed"
          python merge_beta_data.py || echo "⚠️ Beta merge failed"
          
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || ([ "$CURRENT_HOUR" = "06" ] && [ "$CURRENT_MIN" -lt 30 ]); then
            echo "🔄 Running daily beta model retraining..."
            python predict_beta_all.py || echo "⚠️ Beta retrain failed"
          fi
          
          python forecast_beta_now.py || echo "⚠️ Beta forecast failed"
          
          ls -la forecasts.json history.json weather.json watershed_rainfall.json forecasts_beta.json || true
        env:
          PYTHONUNBUFFERED: 1

      - name: Commit and Push Forecast
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name 'Illinois-River-Bot'
          git config --global user.email 'bot@illinoisriver.ai'
          git add -f huc12_training_data_beta.csv master_training_data_beta.csv
          git add forecasts.json history.json weather.json prediction_log.json accuracy_scores.json simulations.json watershed_rainfall.json forecasts_beta.json prediction_log_beta.json accuracy_scores_beta.json
          git add *.pkl 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Automated River Update: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi