# Manual Sync Trigger: 2026-04-02-v1

name: Illinois River Auto-Update

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  update-river-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pipeline
        run: |
          python fetch_all_gauges.py
          python fetch_nwa_precip.py
          python fetch_weather.py
          python merge_data.py
          python predict_all.py
          python forecast_now.py
        env:
          PYTHONUNBUFFERED: 1

      - name: Commit and Push Forecast
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name 'Illinois-River-Bot'
          git config --global user.email 'bot@illinoisriver.ai'
          git add forecasts.json history.json
          git diff --cached --quiet || git commit -m "Automated River Update: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          git push origin HEAD:main