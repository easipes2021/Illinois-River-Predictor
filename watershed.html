<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watershed Intelligence | Illinois River Predictor (Beta)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <style>
        .map-container { height: 400px; }
        .legend-swatch { width: 14px; height: 14px; display: inline-block; border-radius: 3px; border: 1px solid rgba(255,255,255,0.2); }
    </style>
</head>
<body class="bg-slate-900 text-white font-sans min-h-screen">
    <div class="max-w-6xl mx-auto p-4 sm:p-8">
        <header class="mb-8 border-b border-slate-700 pb-4">
            <div class="flex flex-col gap-2 sm:flex-row sm:items-end sm:justify-between">
                <div>
                    <h1 class="text-3xl font-bold">Watershed Intelligence <span class="text-xs uppercase bg-amber-500/20 text-amber-400 px-2 py-1 rounded-full align-middle ml-2">Beta</span></h1>
                    <p class="text-slate-400 mt-1">HUC-12 Sub-Watershed Precipitation (Above Watts Bridge)</p>
                </div>
                <div class="text-right">
                    <a href="index.html" class="text-sm text-sky-400 hover:underline">&larr; Back to Dashboard</a>
                </div>
            </div>
        </header>

        <div class="grid gap-6 xl:grid-cols-2">
            <!-- Map Section -->
            <section class="bg-slate-800 p-6 rounded-3xl shadow-xl border border-slate-700">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-xl font-semibold">Rainfall Map</h2>
                    <div class="flex bg-slate-900 rounded-lg p-1 border border-slate-700">
                        <button id="btn-map-1hr" class="px-3 py-1 text-xs font-medium rounded-md transition-colors text-slate-400 hover:text-white" onclick="setMapMetric('qpe_1hr')">1hr QPE</button>
                        <button id="btn-map-24hr" class="px-3 py-1 text-xs font-medium rounded-md transition-colors bg-slate-700 text-white" onclick="setMapMetric('qpe_24hr')">24hr QPE</button>
                        <button id="btn-map-qpf" class="px-3 py-1 text-xs font-medium rounded-md transition-colors text-slate-400 hover:text-white" onclick="setMapMetric('qpf_24hr')">24hr QPF</button>
                    </div>
                </div>
                
                <div id="watershed-map" class="map-container rounded-2xl bg-slate-900 border border-slate-700"></div>
                
                <div class="flex justify-center gap-4 mt-4 text-xs text-slate-400 flex-wrap">
                    <div class="flex items-center gap-1"><span class="legend-swatch" style="background: rgba(255,255,255,0.05)"></span> 0"</div>
                    <div class="flex items-center gap-1"><span class="legend-swatch" style="background: #fbbf24"></span> 0.01 - 0.24"</div>
                    <div class="flex items-center gap-1"><span class="legend-swatch" style="background: #22c55e"></span> 0.25 - 0.49"</div>
                    <div class="flex items-center gap-1"><span class="legend-swatch" style="background: #3b82f6"></span> 0.50 - 0.99"</div>
                    <div class="flex items-center gap-1"><span class="legend-swatch" style="background: #8b5cf6"></span> 1.00 - 1.99"</div>
                    <div class="flex items-center gap-1"><span class="legend-swatch" style="background: #ef4444"></span> 2.00"+</div>
                </div>
            </section>

            <!-- Table Section -->
            <section class="bg-slate-800 p-6 rounded-3xl shadow-xl border border-slate-700 overflow-hidden flex flex-col">
                <h2 class="text-xl font-semibold mb-4">Tributary Rainfall Breakdown</h2>
                <div class="overflow-x-auto overflow-y-auto flex-1 max-h-[440px]">
                    <table class="w-full text-sm text-left">
                        <thead class="text-xs text-slate-400 uppercase bg-slate-900/50 sticky top-0">
                            <tr>
                                <th class="px-4 py-3 rounded-tl-lg">Sub-Watershed (HUC-12)</th>
                                <th class="px-4 py-3 text-center">1hr QPE</th>
                                <th class="px-4 py-3 text-center">24hr QPE</th>
                                <th class="px-4 py-3 text-center rounded-tr-lg">24hr QPF (Forecast)</th>
                            </tr>
                        </thead>
                        <tbody id="rainfall-tbody" class="divide-y divide-slate-700/50">
                            <tr><td colspan="4" class="px-4 py-8 text-center text-slate-500">Loading data...</td></tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let map;
        let geoLayer;
        let rainfallData = {};
        let activeMetric = 'qpe_24hr';

        function rainColor(val) {
            if (val >= 2.0) return '#ef4444'; // Red
            if (val >= 1.0) return '#8b5cf6'; // Purple
            if (val >= 0.5) return '#3b82f6'; // Blue
            if (val >= 0.25) return '#22c55e'; // Green
            if (val >= 0.01) return '#fbbf24'; // Yellow
            return 'rgba(255,255,255,0.05)'; // Clear
        }

        function styleFeature(feature) {
            const huc12 = feature.properties.huc12;
            const data = rainfallData[huc12] || {};
            const val = data[activeMetric] || 0;
            return {
                fillColor: rainColor(val),
                fillOpacity: val > 0 ? 0.65 : 0.1,
                weight: 1,
                color: '#555',
                opacity: 0.8
            };
        }

        function onEachFeature(feature, layer) {
            const huc12 = feature.properties.huc12;
            const data = rainfallData[huc12] || {};
            const name = data.name || feature.properties.name || huc12;
            
            layer.bindTooltip(`
                <div class="font-sans text-sm">
                    <strong>${name}</strong><br>
                    <span class="text-slate-500 text-xs">${huc12}</span><br>
                    1hr QPE: ${(data.qpe_1hr || 0).toFixed(2)}" <br>
                    24hr QPE: ${(data.qpe_24hr || 0).toFixed(2)}" <br>
                    24hr QPF: ${(data.qpf_24hr || 0).toFixed(2)}"
                </div>
            `, { sticky: true });
        }

        function setMapMetric(metric) {
            activeMetric = metric;
            
            // Update buttons
            ['btn-map-1hr', 'btn-map-24hr', 'btn-map-qpf'].forEach(id => {
                document.getElementById(id).className = "px-3 py-1 text-xs font-medium rounded-md transition-colors text-slate-400 hover:text-white";
            });
            
            const btnMap = { 'qpe_1hr': 'btn-map-1hr', 'qpe_24hr': 'btn-map-24hr', 'qpf_24hr': 'btn-map-qpf' };
            document.getElementById(btnMap[metric]).className = "px-3 py-1 text-xs font-medium rounded-md transition-colors bg-slate-700 text-white";

            if (geoLayer) {
                geoLayer.setStyle(styleFeature);
            }
        }

        async function init() {
            try {
                // Fetch Data
                const [geoRes, rainRes] = await Promise.all([
                    fetch('upper_illinois_huc12.geojson'),
                    fetch('watershed_rainfall.json')
                ]);
                
                const geojson = await geoRes.json();
                rainfallData = await rainRes.json();

                // Build Map
                map = L.map('watershed-map', { scrollWheelZoom: false });
                L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                    attribution: '&copy; CARTO',
                    subdomains: 'abcd',
                    maxZoom: 14
                }).addTo(map);

                geoLayer = L.geoJSON(geojson, {
                    style: styleFeature,
                    onEachFeature: onEachFeature
                }).addTo(map);
                
                map.fitBounds(geoLayer.getBounds(), { padding: [20, 20] });

                // Build Table
                const tbody = document.getElementById('rainfall-tbody');
                tbody.innerHTML = '';
                
                // Sort by name
                const entries = Object.entries(rainfallData).sort((a, b) => a[1].name.localeCompare(b[1].name));
                
                for (const [huc12, data] of entries) {
                    const tr = document.createElement('tr');
                    tr.className = "hover:bg-slate-700/30 transition-colors";
                    
                    const formatCell = (val) => {
                        const bg = rainColor(val);
                        const isClear = val < 0.01;
                        return `<td class="px-4 py-2 text-center" style="background: ${isClear ? 'transparent' : bg}; color: ${isClear ? '#94a3b8' : 'white'}; font-weight: ${isClear ? 'normal' : 'bold'}">${val.toFixed(2)}"</td>`;
                    };

                    tr.innerHTML = `
                        <td class="px-4 py-2">
                            <div class="font-medium text-slate-200">${data.name}</div>
                            <div class="text-[10px] text-slate-500 font-mono">${huc12}</div>
                        </td>
                        ${formatCell(data.qpe_1hr)}
                        ${formatCell(data.qpe_24hr)}
                        ${formatCell(data.qpf_24hr)}
                    `;
                    tbody.appendChild(tr);
                }
            } catch (err) {
                console.error("Error initializing beta dashboard:", err);
                document.getElementById('rainfall-tbody').innerHTML = `<tr><td colspan="4" class="px-4 py-8 text-center text-rose-400">Error loading data. The backfill may still be running.</td></tr>`;
            }
        }

        init();
    </script>
</body>
</html>
